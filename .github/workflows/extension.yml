name: Check and package browser extension
on:
  push:
    paths:
      - 'extension/**'
      - 'lib/**'
      - 'native/**'
      - 'linux/**'
      - 'dev-tools/**'
      - 'pubspec.*'
      - '.github/workflows/extension.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'lib/**'
      - 'native/**'
      - 'linux/**'
      - 'dev-tools/**'
      - 'pubspec.*'
      - '.github/workflows/extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install browser test utilities
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool zip dbus-x11 clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build the native app and companion package
        working-directory: .
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter pub get --enforce-lockfile
          dev-tools/package-linux.sh
          package_file="$GITHUB_WORKSPACE/dist/gopher-client-$(sed -n 's/^version: //p' pubspec.yaml)-linux-$(uname -m).tar.gz"
          echo "GOPHER_NATIVE_PACKAGE=$package_file" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check actual Chromium activation and reader
        run: dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1100x24' npm run test:browser
      - run: npm run package
      - name: Install the Firefox test browser and driver
        run: |
          mkdir -p "$RUNNER_TEMP/gopher-firefox" "$RUNNER_TEMP/gopher-geckodriver"
          curl -fsSL 'https://archive.mozilla.org/pub/firefox/releases/157.0.1/linux-x86_64/en-US/firefox-157.0.1.tar.xz' -o "$RUNNER_TEMP/firefox.tar.xz"
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP/gopher-firefox"
          curl -fsSL 'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz' -o "$RUNNER_TEMP/geckodriver.tar.gz"
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP/gopher-geckodriver"
          echo "GECKODRIVER=$RUNNER_TEMP/gopher-geckodriver/geckodriver" >> "$GITHUB_ENV"
          echo "FIREFOX_BIN=$RUNNER_TEMP/gopher-firefox/firefox/firefox" >> "$GITHUB_ENV"
      - name: Check actual Firefox activation and reader
        run: dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1100x24' npm run test:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: gopher-reader-extension
          path: extension/artifacts/*
